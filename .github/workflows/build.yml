name: Build

on:
  push:
    branches: [ main, feature/extensible-remote-admin ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NetSupport.sln

      - name: Build
        run: dotnet build NetSupport.sln --configuration Release --no-restore

      - name: Publish Windows x64 test build
        run: >-
          dotnet publish src/NetSupport.RemoteAdmin/NetSupport.RemoteAdmin.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/NetSupport.RemoteAdmin-win-x64
          -p:PublishSingleFile=false

      - name: Upload Windows x64 test build
        uses: actions/upload-artifact@v4
        with:
          name: NetSupport.RemoteAdmin-win-x64
          path: artifacts/NetSupport.RemoteAdmin-win-x64
          if-no-files-found: error
          retention-days: 14
